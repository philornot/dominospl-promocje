[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dominospl-promo"
version = "0.1.0"
description = "Scraper for Domino's Pizza Poland promotions"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "playwright>=1.40",
    "beautifulsoup4>=4.12",
]

[project.scripts]
dominospl-promo = "cli:main"

[project.urls]
Homepage = "https://github.com/TWOJ_USERNAME/dominospl-promocje"